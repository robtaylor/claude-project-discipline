name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  doctool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests
        run: uv run --with pytest pytest tests/ -q
      - name: Lint the starter kit
        run: uv run starter/docs/scripts/doctool.py --root starter lint --strict
      - name: Link-check the book
        run: uv run starter/docs/scripts/doctool.py --root . --docs src lint --strict
      - name: Ruff
        run: uvx ruff check starter/docs/scripts/doctool.py tests/

  book:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.40
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin
      - name: Build
        run: mdbook build
